[project]
name = "promotion-policy-optimizer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-projects>=2.5.0,<3",
    "azure-ai-agentserver-optimization",
    "azure-ai-agentserver-responses",
    "azure-identity>=1.25,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "azure-functions>=1.21,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "demo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
